name: ci

# check -> build -> smoke test -> push -> redeploy, all of it in
# vernaillen/workflows. This file only says what is different about this
# repository.
#
# The smoke test this pipeline runs on every app started here; it is now the
# shared default rather than this repository's local invention.
#
# What `check` does lives in package.json:
#   "check": "nuxt prepare && pnpm run lint && pnpm run typecheck && pnpm run build"
#
# Repository configuration (Settings -> Secrets and variables -> Actions), all
# set by vernaillen/workflows/scripts/configure-repo.sh:
#   Secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD  registry on Coolify
#              COOLIFY_TOKEN                         deploy permission
#   Variables: COOLIFY_URL, COOLIFY_APP_UUID         which app to redeploy
#
# COOLIFY_DEPLOY_URL (the whole endpoint in one secret) is no longer read. The
# instance URL and the application UUID are separate now, the same way the other
# two apps have always had them.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main-branch run pushes the image and redeploys, so it always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: vernaillen/workflows/.github/workflows/coolify-deploy.yml@v1
    with:
      image-name: radio-vernaillen-dev
      smoke-port: 3000
      smoke-path: /
      coolify-url: ${{ vars.COOLIFY_URL }}
      coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
    secrets: inherit
